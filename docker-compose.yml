services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: calix_db
      POSTGRES_USER: ${POSTGRES_USER:-calix_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calix_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5434:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-calix_user} -d calix_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    profiles:
      - dev
      - dev-local
      - dev-rolling
      - prod

  app-release:
    build:
      context: .
      target: development-build
      args:
        VINUMC_SOURCE: release
        VINUMC_VERSION: ${VINUMC_VERSION:-vinumc-v0.1.0-alpha}
        NODE_ENV: ${NODE_ENV:-production}
    image: calix-dev
    command: pnpm dev --host 0.0.0.0
    platform: linux/amd64
    volumes:
      - .:/app:cached
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VINUMC_SOURCE: release
      VINUMC_VERSION: ${VINUMC_VERSION:-vinumc-v0.1.0-alpha}
      PUBLIC_YJS_WS_URL: ${PUBLIC_YJS_WS_URL:-ws://localhost:1234}
    depends_on:
      db:
        condition: service_healthy
      yjs-ws:
        condition: service_started
    profiles:
      - dev-release

  app-rolling:
    build:
      context: .
      target: rolling-build
      args:
        NODE_ENV: ${NODE_ENV:-production}
    image: calix-rolling
    command: pnpm dev --host 0.0.0.0
    platform: linux/amd64
    volumes:
      - .:/app:cached
      - /app/node_modules
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VINUMC_SOURCE: rolling
      PUBLIC_YJS_WS_URL: ${PUBLIC_YJS_WS_URL:-ws://localhost:1234}
    depends_on:
      db:
        condition: service_healthy
      yjs-ws:
        condition: service_started
    profiles:
      - dev-rolling

  app-local:
    build:
      context: .
      target: development-build
      args:
        VINUMC_SOURCE: local
        VINUMC_VERSION: ${VINUMC_VERSION:-vinumc-v0.1.0-alpha}
        NODE_ENV: ${NODE_ENV:-production}
    image: calix-dev
    command: pnpm dev --host 0.0.0.0
    platform: linux/amd64
    volumes:
      - .:/app:cached
      - /app/node_modules
      - '${VINUMC_PATH}:/usr/local/bin/vinumc:ro'
    ports:
      - '5173:5173'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      VINUMC_SOURCE: local
      VINUMC_VERSION: ${VINUMC_VERSION:-vinumc-v0.1.0-alpha}
      PUBLIC_YJS_WS_URL: ${PUBLIC_YJS_WS_URL:-ws://localhost:1234}
    depends_on:
      db:
        condition: service_healthy
      yjs-ws:
        condition: service_started
    profiles:
      - dev-local

  # Default app service (uses release)
  app:
    extends: app-release
    profiles:
      - dev

  app-prod:
    platform: linux/amd64
    build:
      context: .
      target: production-build
      args:
        VINUMC_VERSION: ${VINUMC_VERSION:-vinumc-v0.1.0-alpha}
        NODE_ENV: ${NODE_ENV:-production}
    image: calix-prod
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      yjs-ws:
        condition: service_started
    ports:
      - '${HOST_PORT:-3000}:3000'
    profiles:
      - prod

  yjs-ws:
    build:
      context: .
      target: development-build
    command: node scripts/y-websocket-server.js
    ports:
      - '1234:1234'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      YJS_WS_PORT: 1234
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev
      - dev-release
      - dev-local
      - dev-rolling
      - prod

volumes:
  pgdata:
